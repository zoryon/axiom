<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="AXIOM — local-first computer science learning OS" />
  <title>AXIOM — Learning OS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <aside class="rail" id="rail">
    <button class="brand" data-route="dashboard" aria-label="AXIOM home">
      <span class="brand-mark">A</span>
      <span class="brand-word">AXIOM</span>
    </button>

    <nav class="nav" aria-label="Primary navigation">
      <button class="nav-item active" data-route="dashboard"><span class="nav-index">01</span><span>Today</span></button>
      <button class="nav-item" data-route="courses"><span class="nav-index">02</span><span>Courses</span></button>
      <button class="nav-item" data-route="practice"><span class="nav-index">03</span><span>Practice</span></button>
      <button class="nav-item" data-route="library"><span class="nav-index">04</span><span>Library</span></button>
      <button class="nav-item" data-route="record"><span class="nav-index">05</span><span>Record</span></button>
    </nav>

    <div class="rail-bottom">
      <button class="icon-button" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">
        <span class="theme-icon">◐</span>
      </button>
      <button class="profile-chip" data-route="record" title="Academic record">GS</button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumb" id="crumb">YEAR 01 / TODAY</div>
      <div class="top-actions">
        <button class="command-button" id="commandButton"><span>Search lessons</span><kbd>Ctrl K</kbd></button>
        <div class="live-dot"><i></i><span>LOCAL</span></div>
      </div>
    </header>
    <main id="app" tabindex="-1">
      <section class="loading-screen">
        <div class="loading-mark">A</div>
        <p>Loading academic state…</p>
      </section>
    </main>
  </div>

  <div class="command-layer" id="commandLayer" hidden>
    <div class="command-backdrop" data-close-command></div>
    <section class="command-panel" role="dialog" aria-modal="true" aria-label="Search lessons">
      <div class="command-input-wrap"><span>⌕</span><input id="commandInput" autocomplete="off" placeholder="Search title, module, course…" /></div>
      <div class="command-results" id="commandResults"></div>
      <footer><span>↑↓ navigate</span><span>Enter open</span><span>Esc close</span></footer>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
